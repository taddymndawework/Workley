<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2B57DC" />
<title>Dashboard - Workley</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="dash-body">

<!-- id="dashboardPage" keeps app.js's auth guard active: it redirects any
     unauthenticated or unverified session to index.html before we paint,
     then calls renderDashboard() (overridden in dashboard.js). -->
<main id="dashboardPage" class="dash-shell" role="main">
  <div id="dashMount">
    <!-- Quiet loader until Firebase reports the session -->
    <div class="dash-boot">
      <div class="wk-loader" aria-hidden="true"><img src="assets/icon-blue.png" alt="" width="58" height="58"></div>
      <p>Loading your dashboard…</p>
    </div>
  </div>
</main>

<!-- Modal + toast hosts reused by app.js (openProfile, toast, etc.) -->
<div class="overlay" id="overlay" onclick="overlayClick(event)"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script type="module" src="js/firebase-config.js"></script>
</body>
</html>
